<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Engineering agents: traceability-writer writes TRACEABILITY.md, samples-demo-writer writes bad-input.test.ts, security-verifier checks SECURITY.md; CI runs the tests on every push">
  <title>Engineering agents → committed outputs → CI</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B18"/><stop offset="1" stop-color="#0E1736"/></linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t { font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; } .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .hl { opacity: 0; animation: hl 4.5s ease-in-out infinite; }
      @keyframes hl { 0% { opacity: 0 } 8% { opacity: 1 } 26% { opacity: 1 } 36% { opacity: 0 } 100% { opacity: 0 } }
      .dot { opacity: .35; animation: dot 4.5s ease-in-out infinite; }
      @keyframes dot { 0%,36%,100% { opacity: .35 } 10%,26% { opacity: 1 } }
      .ci { opacity: 0; animation: ci 4.5s ease-in-out infinite; }
      @keyframes ci { 0%,55% { opacity: 0 } 70%,92% { opacity: 1 } 100% { opacity: 0 } }
      .flow { stroke-dasharray: 4 6; animation: dash .9s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20 } }
      @media (prefers-reduced-motion: reduce) { .hl, .dot, .ci, .flow { animation: none } .hl, .ci { opacity: 0 } .dot { opacity: 1 } .mover { display: none } }
    </style>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text class="mono" x="24" y="34" font-size="11" fill="#64748B" letter-spacing="1.5">ENGINEERING AGENTS · .claude/agents</text>
  <text class="mono" x="650" y="34" font-size="11" fill="#64748B" letter-spacing="1.5" text-anchor="middle">COMMITTED OUTPUT</text>
  <text class="mono" x="1256" y="34" font-size="11" fill="#64748B" letter-spacing="1.5" text-anchor="end">CHECKED BEFORE DEPLOY</text>

  <!-- connectors -->
  <line x1="344" y1="96" x2="470" y2="96" class="flow" stroke="#475569" stroke-width="2"/>
  <line x1="344" y1="168" x2="470" y2="168" class="flow" stroke="#475569" stroke-width="2"/>
  <line x1="344" y1="240" x2="470" y2="240" class="flow" stroke="#475569" stroke-width="2"/>
  <path d="M830 96 C900 96 900 168 960 168" class="flow" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="830" y1="168" x2="960" y2="168" class="flow" stroke="#475569" stroke-width="2"/>
  <path d="M830 240 C900 240 900 168 960 168" class="flow" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- moving packets -->
  <g filter="url(#soft)" class="mover">
    <circle r="5" fill="#FBBF24"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite" path="M344 96 H830 C900 96 900 168 960 168"/></circle>
    <circle r="5" fill="#F472B6"><animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite" path="M344 168 H960"/></circle>
    <circle r="5" fill="#A78BFA"><animateMotion dur="4.5s" begin="3s" repeatCount="indefinite" path="M344 240 H830 C900 240 900 168 960 168"/></circle>
  </g>

  <!-- row 1 -->
  <g>
    <rect x="24" y="64" width="320" height="64" rx="14" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:0s" x="24" y="64" width="320" height="64" rx="14" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:0s" cx="320" cy="82" r="4" fill="#FBBF24"/>
    <text class="mono" x="44" y="91" font-size="15" font-weight="700" fill="#F1F5F9">traceability-writer</text>
    <text class="t" x="44" y="113" font-size="12.5" fill="#94A3B8">Requirement → screen → route → test</text>
    <rect x="470" y="64" width="360" height="64" rx="14" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:.6s" x="470" y="64" width="360" height="64" rx="14" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-width="1.5"/>
    <text class="mono" x="490" y="91" font-size="14" font-weight="700" fill="#FBBF24">docs/TRACEABILITY.md</text>
    <text class="t" x="490" y="113" font-size="12.5" fill="#94A3B8">FR-01..15 · NFR-01..10 · tricky cases · gaps</text>
  </g>
  <!-- row 2 -->
  <g>
    <rect x="24" y="136" width="320" height="64" rx="14" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:1.5s" x="24" y="136" width="320" height="64" rx="14" fill="#F472B6" fill-opacity="0.07" stroke="#F472B6" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:1.5s" cx="320" cy="154" r="4" fill="#F472B6"/>
    <text class="mono" x="44" y="163" font-size="15" font-weight="700" fill="#F1F5F9">samples-demo-writer</text>
    <text class="t" x="44" y="185" font-size="12.5" fill="#94A3B8">Good, edge and broken input</text>
    <rect x="470" y="136" width="360" height="64" rx="14" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:2.1s" x="470" y="136" width="360" height="64" rx="14" fill="#F472B6" fill-opacity="0.07" stroke="#F472B6" stroke-width="1.5"/>
    <text class="mono" x="490" y="163" font-size="14" font-weight="700" fill="#F472B6">api/test/bad-input.test.ts</text>
    <text class="t" x="490" y="185" font-size="12.5" fill="#94A3B8">Every intake path · samples/ · docs/DEMO.md</text>
  </g>
  <!-- row 3 -->
  <g>
    <rect x="24" y="208" width="320" height="64" rx="14" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:3s" x="24" y="208" width="320" height="64" rx="14" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:3s" cx="320" cy="226" r="4" fill="#A78BFA"/>
    <text class="mono" x="44" y="235" font-size="15" font-weight="700" fill="#F1F5F9">security-verifier</text>
    <text class="t" x="44" y="257" font-size="12.5" fill="#94A3B8">Read-only · the code decides</text>
    <rect x="470" y="208" width="360" height="64" rx="14" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:3.6s" x="470" y="208" width="360" height="64" rx="14" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-width="1.5"/>
    <text class="mono" x="490" y="235" font-size="14" font-weight="700" fill="#A78BFA">SECURITY.md</text>
    <text class="t" x="490" y="257" font-size="12.5" fill="#94A3B8">fixed / open per finding · npm audit</text>
  </g>
  <!-- CI -->
  <g>
    <rect x="960" y="64" width="296" height="208" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="ci" x="960" y="64" width="296" height="208" rx="16" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-width="1.5"/>
    <text class="mono" x="984" y="100" font-size="12" font-weight="700" fill="#34D399">GITHUB ACTIONS</text>
    <text class="t" x="984" y="138" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">CI on main</text>
    <text class="mono" x="984" y="172" font-size="13" fill="#94A3B8">npm run typecheck</text>
    <text class="mono" x="984" y="196" font-size="13" fill="#94A3B8">npm test</text>
    <text class="mono" x="984" y="220" font-size="13" fill="#94A3B8">npm run build</text>
    <text class="t" x="984" y="252" font-size="12.5" fill="#34D399">Red build → API not deployed</text>
  </g>
  <text class="t" x="640" y="302" font-size="12.5" fill="#64748B" text-anchor="middle">Agents draft and check. A person reviews and commits: no agent may commit, and none reads .env.</text>
</svg>
