<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-label="Order pipeline: intake, read, resolve, route, plan, deliver">
  <title>Order pipeline: Intake → Read → Resolve → Route → Plan → Deliver</title>
  <defs>
    <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset=".4" stop-color="#A78BFA"/><stop offset=".7" stop-color="#60A5FA"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B18"/><stop offset="1" stop-color="#0E1736"/></linearGradient>
    <path id="track" d="M24 40 H1256"/>
    <style>
      .t { font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; } .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .hl { opacity: 0; animation: hl 4.199999999999999s ease-in-out infinite; }
      @keyframes hl { 0% { opacity: 0 } 6% { opacity: 1 } 20% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
      .dot { opacity: .35; animation: dot 4.199999999999999s ease-in-out infinite; }
      @keyframes dot { 0%,30%,100% { opacity: .35 } 8%,20% { opacity: 1 } }
      .flow { stroke-dasharray: 4 6; animation: dash .9s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20 } }
      @media (prefers-reduced-motion: reduce) { .hl, .dot, .flow { animation: none } .hl { opacity: 0 } .dot { opacity: 1 } }
    </style>
  </defs>
  <rect width="1280" height="230" rx="20" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="1279" height="229" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="24" y="38" width="1232" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="24" y="38" width="1232" height="4" rx="2" fill="url(#rail)" opacity=".55"/>
  <g filter="url(#soft)">
    <rect x="-14" y="-5" width="28" height="10" rx="5" fill="#F8FAFC"><animateMotion dur="4.199999999999999s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#track" xlink:href="#track"/></animateMotion></rect>
  </g>
  <text class="mono" x="24" y="22" font-size="11" fill="#64748B" letter-spacing="1.5">ORDER PIPELINE</text>
  <text class="mono" x="1256" y="22" font-size="11" fill="#64748B" letter-spacing="1.5" text-anchor="end">EVERY STEP LOGGED TO audit_log</text>
  <line x1="207.0" y1="118" x2="231.4" y2="118" class="flow" stroke="#475569" stroke-width="2"/>
<line x1="417.4" y1="118" x2="441.8" y2="118" class="flow" stroke="#475569" stroke-width="2"/>
<line x1="627.8" y1="118" x2="652.2" y2="118" class="flow" stroke="#475569" stroke-width="2"/>
<line x1="838.2" y1="118" x2="862.6" y2="118" class="flow" stroke="#475569" stroke-width="2"/>
<line x1="1048.6" y1="118" x2="1073.0" y2="118" class="flow" stroke="#475569" stroke-width="2"/>
  <g>
    <rect x="24.0" y="58" width="180" height="120" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:0.0s" x="24.0" y="58" width="180" height="120" rx="16" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-width="1.5"/>
    <text class="mono" x="44.0" y="88" font-size="12" font-weight="700" fill="#FBBF24">01</text>
    <circle class="dot" style="animation-delay:0.0s" cx="180.0" cy="84" r="4" fill="#FBBF24"/>
    <text class="t" x="44.0" y="126" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">Intake</text>
    <text class="t" x="44.0" y="154" font-size="12.5" fill="#94A3B8">Email · API · EDI</text>
  </g>
  <g>
    <rect x="234.4" y="58" width="180" height="120" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:0.7s" x="234.4" y="58" width="180" height="120" rx="16" fill="#F472B6" fill-opacity="0.07" stroke="#F472B6" stroke-width="1.5"/>
    <text class="mono" x="254.4" y="88" font-size="12" font-weight="700" fill="#F472B6">02</text>
    <circle class="dot" style="animation-delay:0.7s" cx="390.4" cy="84" r="4" fill="#F472B6"/>
    <text class="t" x="254.4" y="126" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">Read</text>
    <text class="t" x="254.4" y="154" font-size="12.5" fill="#94A3B8">Foundry agent extracts</text>
  </g>
  <g>
    <rect x="444.8" y="58" width="180" height="120" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:1.4s" x="444.8" y="58" width="180" height="120" rx="16" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-width="1.5"/>
    <text class="mono" x="464.8" y="88" font-size="12" font-weight="700" fill="#A78BFA">03</text>
    <circle class="dot" style="animation-delay:1.4s" cx="600.8" cy="84" r="4" fill="#A78BFA"/>
    <text class="t" x="464.8" y="126" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">Resolve</text>
    <text class="t" x="464.8" y="154" font-size="12.5" fill="#94A3B8">Products · address · Qs</text>
  </g>
  <g>
    <rect x="655.2" y="58" width="180" height="120" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:2.1s" x="655.2" y="58" width="180" height="120" rx="16" fill="#60A5FA" fill-opacity="0.07" stroke="#60A5FA" stroke-width="1.5"/>
    <text class="mono" x="675.2" y="88" font-size="12" font-weight="700" fill="#60A5FA">04</text>
    <circle class="dot" style="animation-delay:2.1s" cx="811.2" cy="84" r="4" fill="#60A5FA"/>
    <text class="t" x="675.2" y="126" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">Route</text>
    <text class="t" x="675.2" y="154" font-size="12.5" fill="#94A3B8">Nearest with stock</text>
  </g>
  <g>
    <rect x="865.6" y="58" width="180" height="120" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:2.8s" x="865.6" y="58" width="180" height="120" rx="16" fill="#2DD4BF" fill-opacity="0.07" stroke="#2DD4BF" stroke-width="1.5"/>
    <text class="mono" x="885.6" y="88" font-size="12" font-weight="700" fill="#2DD4BF">05</text>
    <circle class="dot" style="animation-delay:2.8s" cx="1021.6" cy="84" r="4" fill="#2DD4BF"/>
    <text class="t" x="885.6" y="126" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">Plan</text>
    <text class="t" x="885.6" y="154" font-size="12.5" fill="#94A3B8">Carrier agent at cutoff</text>
  </g>
  <g>
    <rect x="1076.0" y="58" width="180" height="120" rx="16" fill="#111A35" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect class="hl" style="animation-delay:3.5s" x="1076.0" y="58" width="180" height="120" rx="16" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-width="1.5"/>
    <text class="mono" x="1096.0" y="88" font-size="12" font-weight="700" fill="#34D399">06</text>
    <circle class="dot" style="animation-delay:3.5s" cx="1232.0" cy="84" r="4" fill="#34D399"/>
    <text class="t" x="1096.0" y="126" font-size="22" font-weight="700" fill="#F1F5F9" letter-spacing="-.4">Deliver</text>
    <text class="t" x="1096.0" y="154" font-size="12.5" fill="#94A3B8">On time, fully audited</text>
  </g>
  <text class="t" x="640.0" y="214" font-size="12.5" fill="#64748B" text-anchor="middle">Staff stay in the loop at every step: an agent suggests, a person confirms.</text>
</svg>
