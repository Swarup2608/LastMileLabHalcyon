      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: bar 1.4s cubic-bezier(.2,.8,.2,1) forwards, shimmer 3.2s ease-in-out 2s infinite; }
