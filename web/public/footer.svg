<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 140" width="1280" height="140" role="img" aria-label="Halcyon: built for the Halcyon Logistics hackathon">
  <title>Halcyon · built for the Halcyon Logistics hackathon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B18"/><stop offset="1" stop-color="#101B3D"/></linearGradient>
    <clipPath id="c"><rect width="1280" height="140" rx="20"/></clipPath>
    <style>
      .t { font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .road { stroke-dasharray: 18 14; animation: road .8s linear infinite; }
      @keyframes road { to { stroke-dashoffset: 32 } }
      .truck { animation: drive 9s linear infinite; }
      @keyframes drive { from { transform: translateX(-120px) } to { transform: translateX(1400px) } }
      .bob { animation: bob .35s ease-in-out infinite alternate; }
      @keyframes bob { to { transform: translateY(-1.2px) } }
      @media (prefers-reduced-motion: reduce) { .road, .truck, .bob { animation: none } .truck { transform: translateX(560px) } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="140" fill="url(#bg)"/>
    <text class="t" x="640" y="44" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC" letter-spacing="-.4">Halcyon</text>
    <text class="t" x="640" y="68" text-anchor="middle" font-size="13" fill="#94A3B8">Built on synthetic data for the Halcyon Logistics hackathon · no real clients, carriers or addresses</text>
    <line x1="0" y1="118" x2="1280" y2="118" stroke="#334155" stroke-width="2"/>
    <line class="road" x1="0" y1="118" x2="1280" y2="118" stroke="#FBBF24" stroke-opacity=".5" stroke-width="2"/>
    <g class="truck">
      <g class="bob">
        <rect x="0" y="88" width="58" height="24" rx="4" fill="#F59E0B"/>
        <rect x="6" y="94" width="30" height="3" rx="1.5" fill="#0B1226" fill-opacity=".35"/>
        <path d="M60 94 h14 l10 10 v8 h-24 z" fill="#FBBF24"/>
        <rect x="64" y="97" width="9" height="7" rx="1.5" fill="#0B1226" fill-opacity=".7"/>
      </g>
      <circle cx="14" cy="114" r="6" fill="#0B1226" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="70" cy="114" r="6" fill="#0B1226" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="88" y="104" width="22" height="3" rx="1.5" fill="#FDE68A" fill-opacity=".5"/>
    </g>
  </g>
</svg>
